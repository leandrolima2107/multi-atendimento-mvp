services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"

  evolution-go:
    ports:
      - "127.0.0.1:${EVOLUTION_HOST_PORT:-8082}:8080"

  api:
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      NODE_ENV: development
      API_PORT: 4000
      DATABASE_URL: ${API_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/multi_atendimento?schema=public}
      REDIS_URL: ${API_REDIS_URL:-redis://redis:6379}
      EVOLUTION_BASE_URL: http://evolution-go:8080
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4100}:4000"

  web:
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
